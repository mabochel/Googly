name: Android APK

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Sign with the project's own release key when its secrets are available (not on forks), so updates
      # install over the existing app and keep its pairing. Without them the build falls back to the debug key.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.BLUEY_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "No release key secret: signing with the debug key"; exit 0; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/bluey-release.p12"
          echo "BLUEY_STOREFILE=$RUNNER_TEMP/bluey-release.p12" >> "$GITHUB_ENV"
      - name: Test and build
        working-directory: android
        env:
          BLUEY_STOREPASSWORD: ${{ secrets.BLUEY_STOREPASSWORD }}
          BLUEY_KEYALIAS: ${{ secrets.BLUEY_KEYALIAS }}
          BLUEY_KEYPASSWORD: ${{ secrets.BLUEY_KEYPASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: bluey-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
      - name: Render screens
        continue-on-error: true
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest -Pscreenshots --tests '*ScreenshotTest*'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bluey-android-screens
          path: android/app/build/screenshots/
